name: Host-only checks (no firmware build)

# This workflow never builds, links, flashes, or uploads firmware, and it
# requires no secret. The actual firmware link needs the licensed,
# Windows-only MPLAB C18 v3.42 toolchain and cannot run on a hosted runner;
# see doc/building.md ("Cloud CI assessment") for why that stays out of
# scope here and what this workflow checks instead.

on:
  push:
    branches:
    - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    name: host build, shellcheck, PSScriptAnalyzer
    runs-on: ubuntu-24.04

    steps:
    - name: checkout sources
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        persist-credentials: false

    # Compile-only host build of the three C files that already have a
    # cross-compile path (see src/p2_definitions.h lines 47-56). This never
    # links and never runs the resulting objects, and writes only into the
    # ignored build/host-check directory. Only an actual compile error fails
    # this step: -Wall -Wextra warnings are a known, substantial
    # pre-existing backlog on this 2010s embedded C source and are reported,
    # not gated. Do not add -Werror here without first triaging that
    # backlog; do not silence it wholesale either.
    - name: host build (gcc -DUNIX -Wall -Wextra -c, compile only)
      run: make check

    # shellcheck ships preinstalled on this runner image. Findings are
    # reported but non-blocking for now (see doc/building.md), so a
    # pre-existing finding does not fail the job; a regression is still
    # visible in this step's logs/status.
    - name: shellcheck (non-blocking; see doc/building.md)
      id: shellcheck
      continue-on-error: true
      run: |
        shellcheck sync_from_hg.sh import_from_hg.sh tools/build_hwos.sh

    # PSScriptAnalyzer is not preinstalled; pin an exact module version so
    # findings are reproducible. Findings are reported but non-blocking for
    # now (see doc/building.md), matching the shellcheck policy above.
    - name: PSScriptAnalyzer (non-blocking; see doc/building.md)
      id: psscriptanalyzer
      shell: pwsh
      continue-on-error: true
      run: |
        Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck
        $results = Invoke-ScriptAnalyzer -Path tools/build_hwos.ps1
        $results | Format-Table -AutoSize | Out-String -Width 300
        Write-Output "PSScriptAnalyzer findings: $($results.Count)"
        if ($results.Count -gt 0) {
          exit 1
        }
